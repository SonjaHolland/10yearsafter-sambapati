<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chrome TV 16:9</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* TV Frame */

#tv{
    aspect-ratio:16/9;

    width:min(96vw, calc(96vh * 16 / 9));
    height:auto;

    padding:28px;

    box-sizing:border-box;

    border-radius:0;

    background:
        linear-gradient(
            135deg,
            #080808 0%,
            #555 8%,
            #d9d9d9 18%,
            #6f6f6f 30%,
            #222 50%,
            #c2c2c2 72%,
            #444 88%,
            #080808 100%
        );

    box-shadow:
        0 0 40px rgba(0,0,0,.9),
        0 0 120px rgba(0,0,0,.7),
        inset 0 0 20px rgba(255,255,255,.18);
}

/* Screen */

#screen{
    position:relative;
    width:100%;
    aspect-ratio:16/9;

    overflow:hidden;

    background:#000;
}

/* Glasreflectie */

#screen:before{
    content:"";
    position:absolute;

    top:0;
    left:-25%;

    width:45%;
    height:100%;

    background:
        linear-gradient(
            110deg,
            rgba(255,255,255,0),
            rgba(255,255,255,.08),
            rgba(255,255,255,0)
        );

    z-index:2;
    pointer-events:none;
}

/* Blauwe LED */

#screen:after{
    content:"";

    position:absolute;

    left:50%;
    bottom:8px;

    transform:translateX(-50%);

    width:180px;
    height:5px;

    background:#00c8ff;

    box-shadow:
        0 0 10px #00c8ff,
        0 0 20px #00c8ff,
        0 0 40px #00c8ff,
        0 0 70px rgba(0,200,255,.9);

    z-index:3;
}

iframe{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    border:none;

    z-index:1;
}

</style>
</head>
<body>

<div id="tv">

    <div id="screen">

        <iframe
            src="https://www.youtube.com/embed/ykllohKqRU4?autoplay=1&mute=1&controls=0&loop=1&playlist=ykllohKqRU4&rel=0&modestbranding=1"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>

    </div>

</div>

</body>
</html>
